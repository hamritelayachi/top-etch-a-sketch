<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch-a-Sketch by he.</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="flex app">
   
    <div class="flex header">
        <h1 class="title">Etch-a-Sketch</h1>
        <p class="credit">Created by Hamrit Elayachi </p>
    </div>

    <div class="board" id="board" aria-label="Drawing board">
    </div>

    <div class="flex controls">
        
    <div class="flex tools">
        <button aria-label="pen" class="tool-btn" id="pen">
            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><title>edit-line-outline-rounded</title><path fill="currentColor" d="m10.05 21l2-2H21q.425 0 .713.288T22 20t-.288.713T21 21zM5 19h1.425L16.2 9.225L14.775 7.8L5 17.575zM19 6.4L17.6 5zm-3.525 2.125l-.7-.725L16.2 9.225zM3 20v-2.425q0-.4.15-.763t.425-.637L16.2 3.575q.3-.275.663-.425t.762-.15t.775.15t.65.45L20.425 5q.275.3.425.663T21 6.4q0 .4-.138.762t-.437.663l-12.6 12.6q-.275.275-.638.425t-.762.15H4q-.425 0-.713-.288T3 20"/></svg>
        </button>

        <button aria-label="eraser" class="tool-btn" id="eraser">
<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><title>erase</title><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21H9m6.889-6.11L8.464 7.463m-5.571 5.144l9.193-9.193a2 2 0 0 1 2.828 0l4.95 4.95a2 2 0 0 1 0 2.828l-9.243 9.243a1.93 1.93 0 0 1-2.728 0l-5-5a2 2 0 0 1 0-2.828"/></svg>        </button>       
    </div>

    <div class="flex colors">
        <button class="color-btn color-black" data-color="#000000" aria-label="Black"></button>
        <button class="color-btn color-red" data-color="#ff6b6b" aria-label="Red"></button>
        <button class="color-btn color-green" data-color="#6bffb8" aria-label="Green"></button>
        <button class="color-btn color-purple" data-color="#8f6bff" aria-label="Purple"></button>
        <button class="color-btn color-yellow" data-color="#ffe600" aria-label="Yellow"></button>
    </div>
    
    <button class="reset-btn" id="reset">RESET</button>
    
    </div>
</div>
    
    <script src="script.js"></script>
</body>
</html>
